{{ define "head" }}
<link rel="stylesheet" href="{{ "css/story.css" | relURL }}">
{{ end }}

{{ define "main" }}
<article class="story-page">
  {{- .Content -}}

  <div class="story-footer">
    {{ if .Params.quote }}
    <div class="xiaopang-quote">
      <span class="quote-label">小旁语录</span>
      <p>"{{ .Params.quote }}"</p>
    </div>
    {{ end }}

    <nav class="story-nav">
      {{ with .PrevInSection }}
      <a href="{{ .Permalink }}" class="nav-prev">← {{ .Title }}</a>
      {{ end }}
      <a href="{{ "/" | relURL }}" class="nav-home">回到首页</a>
      {{ with .NextInSection }}
      <a href="{{ .Permalink }}" class="nav-next">{{ .Title }} →</a>
      {{ end }}
    </nav>
  </div>
</article>
{{ end }}
